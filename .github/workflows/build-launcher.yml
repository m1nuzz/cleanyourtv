name: build-launcher

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK cmdline-tools
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq unzip >/dev/null
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline
          mv /tmp/cmdline/cmdline-tools "$HOME/android-sdk/cmdline-tools/latest"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Install Android SDK 34
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" >/dev/null
      - name: Build release APK
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Sign APK with committed keystore
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign \
            --ks launcher/keystore/tvhome.p12 --ks-type PKCS12 --ks-pass pass:android --key-pass pass:android \
            --out launcher/app/build/outputs/apk/release/app-release.apk \
            launcher/app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tvhome-apk
          path: launcher/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
